server:
  port: 8083
  error:
    include-message: always

spring:
  application:
    name: agent-demo
  # 同 rag-demo：手动建 DeepSeek 的 chat bean，关掉 OpenAI 的六个自动配置，
  # 否则它们会强读 spring.ai.openai.api-key 而在启动时报错
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# 手写 ReAct 的循环上限：没有上限的话模型可能一直"再来一步"停不下来（也是成本兜底）
agent:
  max-steps: 6
  # 会话记忆。两个上限都要有，缺一个都会在长时间运行后出问题：
  #   max-turns    单会话保留几轮——不设就是每轮都付一次 token 钱，且长上下文里模型会"忘"
  #   max-sessions 最多留几个会话——不设就是内存泄漏（每个新 sessionId 都塞一条，只增不减）
  #   max-facts / max-users 同理，管的是长期画像
  # 注意：全在堆内存，重启即清空、多实例不共享。上生产要换 Redis/DB
  memory:
    max-turns: 6
    max-sessions: 200
    max-facts: 20
    max-users: 200
  knowledge:
    # 知识检索工具指向 rag-demo（作品 1）。两个服务分开跑：
    #   rag-demo   :8081  知识服务（切分/向量化/检索）
    #   agent-demo :8083  编排服务（什么时候调工具、怎么用结果）
    # 走环境变量可覆盖，方便换端口/换机器部署（不改代码）
    base-url: ${AGENT_KNOWLEDGE_BASE_URL:http://localhost:8081}

# Key 只走环境变量（setx DEEPSEEK_API_KEY "sk-xxx"），不进代码/仓库
llm:
  chat:
    base-url: https://api.deepseek.com
    model: deepseek-chat
    api-key: ${DEEPSEEK_API_KEY:}
